<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Shop | My Cart</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/images/flower-bouquet.png" />
    
</head>
<body>
    <!--مكرر في كل صفحة-->
    <header>
        <input type="checkbox" id="toggler">
        <label for="toggler" class="fas fa-bars"></label>
        <a href="index.html" class="logo">flower<span>.</span></a>
        <nav class="navBar">
            <a href="index.html#home">home</a>
            <a href="index.html#about">about</a>
            <a href="products.html">products</a>
            <a href="index.html#review">review</a>
            <a href="index.html#contact">contact</a>
        </nav>
        <div class="icons">
            <a href="cart.html" class="fas fa-shopping-cart">
                <span id="cart-badge">0</span>
            </a>
        </div>
    </header>

    <section class="cart-section" style="padding-top: 15rem;">
        <h1 class="heading"> shopping <span>cart</span> </h1>
        
        <div id="cart-container" class="cart-wrapper"> <!--هيتملي بالجافا-->
            </div>

        <div id="cart-footer" class="cart-summary-card" style="display: none;">
            <div class="total-row">
                <span>Total:</span>
                <span id="final-price">0 LE</span>
            </div>
            <div id="checkout-section">
                <h2 class="sub-heading">Checkout Details</h2>
                <form class="checkout-form">
                    <input type="text" placeholder="Full Name" required class="form-input">
                    <input type="number" placeholder="Phone Number" required class="form-input">
                    <input type="text" placeholder="Adress" required class="form-input">

                    <button type="submit" class="sub-btn">Place Order Now</button>
                </form>
            </div>
        </div>
    </section>
    <script>
        // لو الكارت فاضيه هظهرلو مسج والفوتر هيبقا display none
        function renderCart() {
            const container = document.getElementById('cart-container');
            const footer = document.getElementById('cart-footer');
            const finalPriceElem = document.getElementById('final-price');
            let cart = JSON.parse(localStorage.getItem('flowers_cart')) || [];
           if(cart.length === 0) { 
                container.innerHTML = `
                    <div class="empty-cart" style="text-align:center; padding: 5rem;">
                        <i class="fas fa-shopping-basket" style="font-size: 8rem; color: #eee;"></i>
                        <p style="font-size: 2rem; color: #666; margin-top: 2rem;">Your cart is empty. Let's pick some flowers!</p>
                        <a href="products.html" class="btn" style="margin-top: 2rem; display: inline-block;">Go to Shop</a>
                    </div>`;
                footer.style.display = 'none'; 
                return;
            }
            // غير كده ف هظهر الفوتر عادي واحط توتال السعر بصفر
            footer.style.display = 'block';
            let grandTotal = 0;

            container.innerHTML = cart.map((item, index) => { //لو السلة فيها ف انا بلف ع الاراي عنصر عنصر
                const unitPrice = parseInt(item.price) || 0; //احول السعر لرقم int
                const subTotal = unitPrice * item.quantity; 
                grandTotal += subTotal;
                //برجع صورة المنتج واسمه وسعره
                return `
                <div class="cart-item-card">
                    <div class="item-img">
                        <img src="${item.image}" alt="${item.name}"> 
                    </div>
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <p class="unit-p">Unit Price: ${unitPrice} LE</p>
                        
                        <div class="item-actions">
                            <div class="qty-selector">
                                <button onclick="updateQty(${index}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="updateQty(${index}, 1)">+</button>
                            </div>
                            <button class="remove-link" onclick="deleteItem(${index})">Remove Item</button>
                        </div>
                    </div>
                    <div class="item-total-column">
                        <p class="total-label">Subtotal</p>
                        <span class="total-val">${subTotal} LE</span>
                    </div>
                </div>`;
            }).join('');

            finalPriceElem.innerText = grandTotal + " LE";
        }
        function updateQty(index, change) {
            let cart = JSON.parse(localStorage.getItem('flowers_cart')) || [];
            if(cart[index].quantity + change > 0) {
                cart[index].quantity += change;
                localStorage.setItem('flowers_cart', JSON.stringify(cart));
                renderCart(); 
            } else {
                deleteItem(index);
            }
        }
        function deleteItem(index) {
            let cart = JSON.parse(localStorage.getItem('flowers_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('flowers_cart', JSON.stringify(cart));
            renderCart();
        }
        window.addEventListener('load', renderCart);
    </script>
</body>
</html>
